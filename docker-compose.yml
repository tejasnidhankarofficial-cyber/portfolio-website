services:
  # Production build served by nginx: http://localhost:8080
  web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Live-reload dev server while you keep improving the site: http://localhost:5173
  # Run with: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
